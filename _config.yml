title:       "In2Lab"
tagline:     "Intelligent Information Systems Laboratory"
description: >
  Research group at the Faculty of Engineering, Universidad de Antioquia.
  We develop machine learning methods and intelligent systems that advance
  science and society.

url:     "https://in2labudea.github.io"
baseurl: ""

# Links
links:
  github:   https://github.com/IN2LABUDEA
  gruplac:  https://scienti.minciencias.gov.co/gruplac/jsp/visualiza/visualizagr.jsp?nro=00000000000712
  email:    julian.ariasl@udea.edu.co
  udea:     https://www.udea.edu.co
  udea_eng: https://ingenieria.udea.edu.co

# Roles control display order in the People page
roles:
  - name: Coordinator
    tag:  coord
  - name: Researchers
    tag:  researcher

# Build
markdown:  kramdown
highlighter: rouge
theme: null
permalink: /news/:year/:month/:day/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - Makefile

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "_posts"
      type:  posts
    values:
      layout: post
