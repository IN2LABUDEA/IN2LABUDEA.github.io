- title:   "Prodromal phospholipid signature of cognitive dysfunction and dementia"
  desc:    >
    This project aims to characterize the serum phospholipid profile across distinct stages of AD progression — from presymptomatic to symptomatic phases — using both a triple-transgenic mouse model (3xTg-AD) and human familial AD patients. By mapping phospholipid signatures at defined time points, the study seeks to identify early lipid biomarkers associated with disease onset and progression. These signatures will be correlated with neuroinflammatory and histopathological markers in the hippocampus to establish mechanistic links between peripheral lipid dysregulation and central pathology. Building on these findings, candidate phospholipids will be encapsulated in liposomes to assess, in vitro, the effects of both pathological and protective lipid signatures on astrocyte and microglial activity in co-culture with neurons. Together, this work aims to advance the understanding of phospholipid-driven neuroinflammation in AD and to evaluate liposome-based platforms as potential therapeutic or diagnostic tools for cognitive decline and dementia.
  status:  active
  started: 2022
  ended:   null
  tags:    [metabolomics, healthcare]
  people:
    - "Gloria P. Cardona-Gómez (PI)"
    - "Julián D. Arias-Londoño"
  funding: "MinCiencias"
  link:    null

