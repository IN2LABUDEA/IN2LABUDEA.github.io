- title:   "Automatic Detection and Assessment of Voice Pathologies"
  desc:    >
    Development of machine learning methods for the automatic detection,
    characterization, and severity grading of voice disorders from acoustic
    and aerodynamic signals, targeting clinical deployment in Colombian
    hospitals.
  status:  active
  started: 2021
  ended:   null
  tags:    [ml, biomedical, speech, healthcare]
