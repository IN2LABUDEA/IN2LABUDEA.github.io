- title:   "Design of an AI-Based Co-Adaptive Control System to Improve Adherence to Myoelectric Transradial Prostheses"
  desc:    >
    This project proposes the design of an AI-based co-adaptive control system for myoelectric transradial 
    prostheses, aimed at improving users’ interaction with and continued use of the prosthesis. The approach 
    combines user adaptation and system adaptation, allowing the control strategy to progressively adjust
    to changes in the user’s myoelectric signals, movement patterns, and interaction context. 
  status:  active
  started: 2022
  ended:   null
  tags:    [ml, biomedical, healthcare]
  people:
