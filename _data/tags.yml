# ─────────────────────────────────────────────────────────────────────────────
# Tag taxonomy for In2Lab
#
# type: "line"  → research line (green palette, solid)
# type: "area"  → application area (teal palette, outlined)
#
# These IDs are referenced in _data/projects.yml, publications.yml,
# and students.yml under the `tags:` field.
# The CSS in assets/css/main.css defines one color rule per id.
# ─────────────────────────────────────────────────────────────────────────────

